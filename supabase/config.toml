# PickUp UCF — Supabase local config
# See https://supabase.com/docs/guides/cli/config

project_id = "pickup-ucf"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "pickupucf://auth/confirm"
additional_redirect_urls = ["pickupucf://auth/reset-password"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# 6-digit code length and lifetime (seconds). Match hosted: Auth → Providers → Email.
otp_length = 6
otp_expiry = 300
